<!DOCTYPE html>
<html>
<head>
  <title>Ingredient</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom,#f7e8ef,#fff8f5);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.7);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #846879;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #f4e8ef;
      color: #846879;
      text-align: left;
      padding: 12px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.6;
      color: #846879;
      text-align: left;
      font-family: Georgia, serif;
      white-space: pre-line;
    }

    .loading {
      text-align: center;
      margin-top: 80px;
      color: #666;
    }

    .back-btn {
      position: fixed;
      top: 30px;
      left: 60px;
      padding: 14px 20px;
      border-radius: 14px;
      background: #9fb3a0;
      color: white;
      text-decoration: none;
      font-size: 16px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<div id="content" class="loading">
  Loading ingredient...
</div>

<script>

/* =========================
   AIRTABLE
========================= */

const BASE_ID = "appdp6pW4Vyi1OyRQ";
const TABLE = "Ingredients";
const TOKEN = "patINZji6RgUJ2Bc8.238abfe784afafecb900c9a2645c76d8f329485d70e5e4f44c2972de7e7cf48b";

const FEEDBACK_BASE_ID = "appMdOGTy2Orxq6e8";
const FEEDBACK_TABLE_ID = "tblSRZLzKYDO14SAL";
const FEEDBACK_TOKEN = "patrohXM8eXzh7VrX.e69a15034caaf48f95ac6a9825ebc1e20885e8917867ce4cf1929b8e589088cd";
/* =========================
   GLOBAL STATE
========================= */

let currentIngredient = "";

/* =========================
   GET URL PARAM
========================= */

function getIngredientName() {
  const params = new URLSearchParams(window.location.search);
  return params.get("name");
}

/* =========================
   CLEAN TEXT
========================= */

function clean(text) {
  return (text || "")
    .toLowerCase()
    .replace(/\([^)]*\)/g, "")
    .replace(/[\/\\]/g, " ")
    .replace(/[-–—]/g, " ")
    .replace(/[.,]/g, "")
    .replace(/[\u200B-\u200D\uFEFF]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* =========================
   SUBMIT REQUEST (AIRTABLE)
========================= */

async function submitRequest() {

  const request = document.getElementById("requestBox").value;

  if (!request.trim()) {
    alert("Please enter a request.");
    return;
  }

  const response = await fetch(
    `https://api.airtable.com/v0/${FEEDBACK_BASE_ID}/${FEEDBACK_TABLE_ID}`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${FEEDBACK_TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        fields: {
          Request: request,
          Ingredient: currentIngredient || "Unknown",
          Date: new Date().toISOString().split("T")[0]
        }
      })
    }
  );

  const result = await response.json();

  console.log("STATUS:", response.status);
  console.log("RESULT:", result);

  if (response.ok) {

    document.getElementById("requestBox").value = "";

    document.getElementById("requestMessage").innerHTML =
      "✓ Thank you! Your submission has been received.";

  } else {

    document.getElementById("requestMessage").innerHTML =
      `Error ${response.status}: ${
        result.error?.message || "Unknown error"
      }`;

  }
}
  
/* =========================
   LOAD INGREDIENT
========================= */

async function loadIngredient() {

  const name = getIngredientName();

  if (!name) {
    document.getElementById("content").innerHTML =
      "No ingredient selected.";
    return;
  }

  try {

    let allRecords = [];
    let offset = null;

    do {

      let url =
        `https://api.airtable.com/v0/${BASE_ID}/${TABLE}`;

      if (offset) url += `?offset=${offset}`;

      const res = await fetch(url, {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      });

      const data = await res.json();

      allRecords = [...allRecords, ...data.records];

      offset = data.offset;

    } while (offset);

    const cleanedName = clean(name);

    const ingredient = allRecords.find(r =>
      clean(r.fields["Ingredient Name"]) === cleanedName
    );

    if (!ingredient) {
      document.getElementById("content").innerHTML =
        `<div class="loading">Ingredient not found.</div>`;
      return;
    }

    const f = ingredient.fields;

    currentIngredient = f["Ingredient Name"] || "";

    document.getElementById("content").innerHTML = `
      <a href="javascript:history.back()" class="back-btn">
        ← Back
      </a>

      <div class="container">

        <div class="title">
          ${f["Ingredient Name"] || ""}
        </div>

        <table>

          <tr><th>Toxicological Evaluation</th></tr>
          <tr><td>${f["Toxicological Evaluation"] || ""}</td></tr>

          <tr><th>Dermal Absorption</th></tr>
          <tr><td>${f["Dermal Absorption"] || ""}</td></tr>

          <tr><th>Margin of Safety (MoS)</th></tr>
          <tr><td>${f["Margin of Safety (MoS) Calculation"] || ""}</td></tr>

          <tr><th>Allergen Risk</th></tr>
          <tr><td>${f["Allergen Risk"] || ""}</td></tr>

          <tr><th>Irritation Risk</th></tr>
          <tr><td>${f["Irritation Risk"] || ""}</td></tr>

          <tr><th>Conclusion</th></tr>
          <tr><td>${f["Conclusion"] || ""}</td></tr>

        </table>

        <div style="
          margin-top:25px;
          padding:12px;
          background:rgba(255,255,255,0.65);
          border-radius:14px;
        ">

         <h3 style="color:#846879; white-space: pre-line;">
  Keep us informed!
  share info or request an ingredient or product to be reviewed
</h3>

        <textarea
  id="requestBox"
  placeholder="Enter your request here..."
  style="
    width:50%;
    min-height:60px;
    padding:12px;
    border-radius:10px;
    resize:none;
    display:block;
    margin:0 auto;
  "
></textarea>

          <button onclick="submitRequest()"
            style="margin-top:12px;padding:10px 18px;background:#846879;color:white;border:none;border-radius:10px;">
            Submit
          </button>

          <div id="requestMessage" style="margin-top:10px;"></div>

        </div>

      </div>
    `;

  } catch (err) {
    console.error(err);
    document.getElementById("content").innerHTML =
      `<div class="loading">Error loading ingredient.</div>`;
  }
}

loadIngredient();

</script>

</body>
</html>
