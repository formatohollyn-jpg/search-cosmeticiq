<!DOCTYPE html>
<html>
<head>
  <title>Ingredient</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom,#f7e8ef,#fff8f5);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.7);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #846879;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #f4e8ef;
      color: #846879;
      text-align: left;
      padding: 12px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.6;
      color: #444;
    }

    .loading {
      text-align: center;
      margin-top: 80px;
      color: #666;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #9fb3a0;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="content" class="loading">
  Loading ingredient...
</div>

<script>

/* =========================
   AIRTABLE
========================= */

const BASE_ID = "appdp6pW4Vyi1OyRQ";
const TOKEN = "patINZji6RgUJ2Bc8.238abfe784afafecb900c9a2645c76d8f329485d70e5e4f44c2972de7e7cf48b";
const TABLE = "Ingredients";

/* =========================
   GET URL PARAM
========================= */

function getIngredientName() {
  const params = new URLSearchParams(window.location.search);
  return params.get("name");
}

/* =========================
   CLEAN INGREDIENT NAMES
========================= */

function clean(text) {

  return (text || "")

    .toLowerCase()

    .replace(/\([^)]*\)/g, "")

    .replace(/[\/\\]/g, " ")

    .replace(/[-–—]/g, " ")

    .replace(/[.,]/g, "")

    .replace(/[\u200B-\u200D\uFEFF]/g, "")

    .replace(/\s+/g, " ")

    .trim();

}

/* =========================
   LOAD INGREDIENT
========================= */

async function loadIngredient() {

  const name = getIngredientName();

  if (!name) {

    document.getElementById("content").innerHTML =
      "No ingredient selected.";

    return;
  }

  try {

    let allRecords = [];
    let offset = null;

    do {

      let url =
        `https://api.airtable.com/v0/${BASE_ID}/${TABLE}`;

      if (offset) {
        url += `?offset=${offset}`;
      }

      const res = await fetch(url, {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      });

      const data = await res.json();

      allRecords = [
        ...allRecords,
        ...data.records
      ];

      offset = data.offset;

    } while (offset);

    const cleanedName = clean(name);

    console.log("Searching for:", cleanedName);

    const ingredient = allRecords.find(r =>
      clean(r.fields["Ingredient Name"]) === cleanedName
    );

    if (!ingredient) {

      document.getElementById("content").innerHTML =
        `<div class="loading">Ingredient not found.</div>`;

      return;
    }

    const f = ingredient.fields;

    document.getElementById("content").innerHTML = `

        <a href="javascript:history.back()"
           class="back-btn">
          ← Back
        </a>
        
      <div class="container">

        <div class="title">
          ${f["Ingredient Name"] || ""}
        </div>

        <table>

          <tr>
            <th>Toxicological Evaluation</th>
          </tr>
          <tr>
            <td>${f["Toxicological Evaluation"] || ""}</td>
          </tr>

          <tr>
            <th>Dermal Absorption</th>
          </tr>
          <tr>
            <td>${f["Dermal Absorption"] || ""}</td>
          </tr>

          <tr>
            <th>Margin of Safety (MoS) Calculation</th>
          </tr>
          <tr>
            <td>${f["Margin of Safety (MoS) Calculation"] || ""}</td>
          </tr>

          <tr>
            <th>Conclusion</th>
          </tr>
          <tr>
            <td>${f["Conclusion"] || ""}</td>
          </tr>

        </table>

      </div>

    `;

  }

  catch (err) {

    console.error(err);

    document.getElementById("content").innerHTML =
      `<div class="loading">Error loading ingredient.</div>`;

  }

}

loadIngredient();

</script>

</body>
</html>
