<div id="product">Loading...</div>

<script>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

const id =
  new URLSearchParams(window.location.search).get("id");

async function loadProduct() {

  const url =
    `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`;

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${TOKEN}`
    }
  });

  const data = await res.json();

  const f = data.fields;

  ddocument.getElementById("product").innerHTML = `
  <div style="
    max-width:520px;
    margin:40px auto;
    padding:20px;
    font-family: Arial, sans-serif;
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
  ">

    <h1 style="
      font-size:26px;
      margin-bottom:10px;
      color:#111;
    ">
      ${f["Product Name"] || ""}
    </h1>

    ${f["Product Image"] ? `
      <img src="${f["Product Image"][0]?.url || ""}"
        style="
          width:100%;
          max-height:320px;
          object-fit:cover;
          border-radius:14px;
          margin-bottom:15px;
        " />
    ` : ""}

    <div style="font-size:14px; color:#444; line-height:1.6;">

      <p><b>Brand:</b> ${f["Brand"] || ""}</p>
      <p><b>Type:</b> ${f["Product Type"] || ""}</p>
      <p><b>Size:</b> ${f["Size"] || ""}</p>
      <p><b>Rating:</b> ⭐ ${f["Rating"] || ""}</p>

      <div style="margin-top:15px;">
        <h3 style="margin-bottom:8px;">Ingredients</h3>
        <div style="
          background:#f6f6f6;
          padding:12px;
          border-radius:12px;
          font-size:13px;
          white-space:pre-wrap;
        ">
          ${f["Ingredients"] || ""}
        </div>
      </div>

    </div>
  </div>
`;
}

loadProduct();

</script>
