<div id="product">Loading product...</div>

<script>
  <div style="padding:15px;">
  <button onclick="window.location.href='index.html'"
    style="
      padding:10px 14px;
      border:none;
      border-radius:8px;
      background:#111;
      color:white;
      cursor:pointer;
      margin-bottom:15px;
    ">
    ← Back to Search
  </button>

  <div id="product">Loading...</div>
</div>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

const id = new URLSearchParams(window.location.search).get("id");

async function loadProduct() {

  const url =
    `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`;

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${TOKEN}`
    }
  });

  const data = await res.json();

  const f = data.fields;

 document.getElementById("product").innerHTML = `
  <div style="
    max-width:500px;
    margin:auto;
    font-family:Arial;
    background:#fff;
    padding:20px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
  ">

    <h1 style="margin-bottom:10px;">${f["Product Name"] || ""}</h1>

    <img src="${f["Product Image"]?.[0]?.url || ""}"
      style="width:100%;border-radius:12px;margin-bottom:15px;" />

    <p><b>Brand:</b> ${f["Brand"] || ""}</p>
    <p><b>Type:</b> ${f["Product Type"] || ""}</p>
    <p><b>Rating:</b> ⭐ ${f["Rating"] || ""}</p>

    <h3 style="margin-top:15px;">Ingredients</h3>
    <p>${f["Ingredients"] || ""}</p>

  </div>
`;
}

loadProduct();

</script>
