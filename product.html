<!DOCTYPE html>
<html>
<head>
  <title>Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom,#f7e8ef,#fff8f5);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .image-box { flex: 1; min-width: 280px; }

    .image-box img {
      width: 100%;
      border-radius: 16px;
    }

    .info { flex: 1; min-width: 280px; }

    .name { font-size: 28px; font-weight: bold; color:#846879; }
    .brand, .type { color:#846879; }

    .error { text-align:center; margin-top:80px; color:red; }
    .loading { text-align:center; margin-top:80px; color:#777; }

    .score-box {
      margin: 18px 0;
      padding: 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.65);
    }

    .score-number {
      font-size: 34px;
      font-weight: bold;
      color:#846879;
    }

    .ingredient-table {
      width:100%;
      margin-top:18px;
      border-collapse: collapse;
    }

    .ingredient-table th,
    .ingredient-table td {
      padding:10px;
      border-bottom:1px solid #eee;
      text-align:center;
    }

    .ingredient-table th {
      background:#f4e8ef;
    }
  </style>
</head>

<body>

<div id="content" class="loading">Loading product...</div>

<script>

/* =======================
   DATABASE INFO
======================= */

const PRODUCT_BASE_ID = "apph6wlZKiRLkKk8k";
const PRODUCT_TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";
const PRODUCT_TABLE = "Table 1"; // IMPORTANT: keep normal, NOT encoded

const INGREDIENT_BASE_ID = "appEonAf1g5YbUi7Q";
const INGREDIENT_TOKEN = "pat3YpZtlMB9CDiNF.e5d36fe9c1752cf6fc8bb2c924577ccbb1707a3e63d970c8c401e142e99ec782";
const INGREDIENT_TABLE = "Ingredients";

/* =======================
   GET PRODUCT ID
======================= */

function getProductId() {
  return new URLSearchParams(window.location.search).get("id");
}

/* =======================
   LOAD INGREDIENTS
======================= */

async function loadIngredients() {
  let allRecords = [];
  let offset = null;

  do {
    let url = `https://api.airtable.com/v0/${INGREDIENT_BASE_ID}/${INGREDIENT_TABLE}`;
    if (offset) url += `?offset=${offset}`;

    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${INGREDIENT_TOKEN}` }
    });

    const data = await res.json();
    allRecords = [...allRecords, ...data.records];
    offset = data.offset;

  } while (offset);

  return allRecords.map(r => ({
    name: r.fields["Ingredient"],
    score: r.fields["Risk Score"] || 5,
    level: r.fields["Risk Level"] || "Low",
    why: r.fields["Why"] || ""
  }));
}

/* =======================
   LOAD PRODUCT
======================= */

async function loadProduct() {

  const id = getProductId();

  console.log("PRODUCT ID:", id);

  if (!id) {
    document.getElementById("content").innerHTML =
      `<div class="error">No product selected.</div>`;
    return;
  }

  try {

    const productUrl =
      `https://api.airtable.com/v0/${PRODUCT_BASE_ID}/${PRODUCT_TABLE}/${id}`;

    const res = await fetch(productUrl, {
      headers: {
        Authorization: `Bearer ${PRODUCT_TOKEN}`
      }
    });

    console.log("STATUS:", res.status);

    const text = await res.text();
    console.log("RAW RESPONSE:", text);

    if (!res.ok) {
      throw new Error(text);
    }

    const r = JSON.parse(text);

    console.log("PARSED RECORD:", r);

    if (!r || !r.fields) {
      throw new Error("Missing fields in Airtable response");
    }

    const p = {
      name: r.fields["Product Name"] || "Unnamed Product",
      brand: r.fields["Brand"] || "",
      type: r.fields["Product Type"] || "",
      image: r.fields["Product Image"],
      ingredients: r.fields["Ingredients"] || ""
    };

    const imgUrl = p.image?.[0]?.url;

    /* LOAD INGREDIENTS */
    const ingredientDB = await loadIngredients();

    const ingredientList = p.ingredients
      .split(",")
      .map(i => i.trim())
      .filter(Boolean);

    let ingredientHTML = "";
    let totalRisk = 0;

    ingredientList.forEach(i => {
      const match = ingredientDB.find(x => x.name === i);

      let score = match?.score || 0;
      let level = match?.level || "UNKNOWN";
      let why = match?.why || "Not found";

      totalRisk += score;

      ingredientHTML += `
        <tr>
          <td>${i}</td>
          <td>${score}</td>
          <td>${level}</td>
          <td>${why}</td>
        </tr>
      `;
    });

    let productScore = Math.max(0, Math.min(100, Math.round(100 - (totalRisk / ingredientList.length))));

    document.getElementById("content").innerHTML = `
      <div class="container">

        <div class="image-box">
          ${imgUrl ? `<img src="${imgUrl}">` : ""}
        </div>

        <div class="info">
          <div class="name">${p.name}</div>
          <div class="brand">${p.brand}</div>
          <div class="type">${p.type}</div>

          <div class="score-box">
            <div class="score-number">${productScore}/100</div>
          </div>

        </div>

      </div>

      <div class="container">
        <table class="ingredient-table">
          <tr>
            <th>Ingredient</th>
            <th>Score</th>
            <th>Level</th>
            <th>Why</th>
          </tr>
          ${ingredientHTML}
        </table>
      </div>
    `;

  } catch (err) {
    console.log("ERROR:", err);
    document.getElementById("content").innerHTML =
      `<div class="error">Could not load product. Check console.</div>`;
  }
}

loadProduct();

</script>

</body>
</html>
