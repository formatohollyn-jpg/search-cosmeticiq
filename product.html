<!DOCTYPE html>
<html>
<head>
  <title>Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:#fff8f5;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .image-box {
      flex: 1;
      min-width: 280px;
    }

    .image-box img {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
      background: #eee;
    }

    .info {
      flex: 1;
      min-width: 280px;
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .brand {
      color: #666;
      margin-bottom: 10px;
    }

    .rating {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    .type {
      display: inline-block;
      padding: 6px 10px;
      background: #f0f0f0;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      margin-top: 80px;
      color: #777;
    }

    .error {
      text-align: center;
      margin-top: 80px;
      color: red;
    }
  </style>
</head>

<body>

<div id="content" class="loading">Loading product...</div>

<script>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

function getProductId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

async function loadProduct() {
  const id = getProductId();

  if (!id) {
    document.getElementById("content").innerHTML =
      `<div class="error">No product selected.</div>`;
    return;
  }

  try {
    const res = await fetch(
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    );

    if (!res.ok) {
      throw new Error("Failed to load product");
    }

    const r = await res.json();

    const p = {
      name: r.fields["Product Name"] || "Unnamed Product",
      brand: r.fields["Brand"] || "",
      type: r.fields["Product Type"] || "",
      rating: r.fields["Rating"] || "N/A",
      image: r.fields["Product Image"]
    };

    const imgUrl = p.image?.[0]?.url;

   document.getElementById("content").innerHTML = `

  <div class="container">

        <div class="image-box">
          ${imgUrl ? `<img src="${imgUrl}">` : `<div style="height:300px;background:#eee;border-radius:16px;"></div>`}
        </div>
  <div class="info">
  <div class="name">${p.name}</div>
  <div class="brand">${p.brand}</div>

  <div class="type">${p.type}</div>

  <div class="rating">⭐ ${p.rating}</div>

  <p style="color:#666;line-height:1.5;">
    More product details will go here once you add more fields in Airtable.
  </p>

  <button onclick="window.location.href='index.html'"
    style="
    .back-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #f4f8f4;
  color: white;
  cursor: pointer;
  font-size: 14px;
  z-index: 1000;
}
    ">
    ← Back to Search
  </button>

</div>
    `;

  } catch (err) {
    document.getElementById("content").innerHTML =
      `<div class="error">Could not load product.</div>`;
  }
}

loadProduct();

</script>

</body>
</html>
