<!DOCTYPE html>
<html>
<head>
  <title>Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom,#f7e8ef,#fff8f5);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .image-box {
      flex: 1;
      min-width: 280px;
    }

    .image-box img {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
    }

    .info {
      flex: 1;
      min-width: 280px;
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .brand {
      color: #666;
      margin-bottom: 10px;
    }

    .type {
      display: inline-block;
      padding: 6px 10px;
      background: #f0f0f0;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .rating {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      margin-top: 80px;
      color: #777;
    }

    .error {
      text-align: center;
      margin-top: 80px;
      color: red;
    }
  </style>
</head>

<body>

<div id="content" class="loading">Loading product...</div>

<script>

/* =======================
   AIRTABLE CONFIG
======================= */

const BASE_ID = "appEonAf1g5YbUi7Q";
const TABLE_ID = "tblqIaDe6XJfHbKF5";      // products table
const INGREDIENT_TABLE = "Ingredients";     // MUST match Airtable table name
const TOKEN = "pat3YpZtlMB9CDiNF.e5d36fe9c1752cf6fc8bb2c924577ccbb1707a3e63d970c8c401e142e99ec782";

/* =======================
   GET PRODUCT ID
======================= */

function getProductId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

/* =======================
   INGREDIENT DATABASE
======================= */

async function loadIngredients() {
  try {
    const res = await fetch(
      `https://api.airtable.com/v0/${BASE_ID}/${INGREDIENT_TABLE}`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    );

    const data = await res.json();

    if (!data.records) {
      console.log("Ingredient API error:", data);
      return [];
    }

    return data.records.map(r => ({
      name: r.fields["Ingredient"],
      score: Number(r.fields["Risk Score"]) || 5,
      level: r.fields["Risk Level"] || "Low",
      why: r.fields["Why"] || ""
    }));

  } catch (err) {
    console.log("Ingredient fetch failed:", err);
    return [];
  }
}

/* =======================
   MATCH INGREDIENT
======================= */

function getIngredientData(name, db) {
  return db.find(i =>
    (i.name || "").toLowerCase().trim() ===
    name.toLowerCase().trim()
  );
}

/* =======================
   LOAD PRODUCT
======================= */

async function loadProduct() {
  const id = getProductId();
console.log("PRODUCT ID:", id);
  
  if (!id) {
    document.getElementById("content").innerHTML =
      `<div class="error">No product selected.</div>`;
    return;
  }

  try {

    /* 1. GET PRODUCT */
    const res = await fetch(
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${id}`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    );

    const r = await res.json();
    console.log("PRODUCT RESPONSE:", r);

    const p = {
      name: r.fields["Product Name"] || "Unnamed Product",
      brand: r.fields["Brand"] || "",
      type: r.fields["Product Type"] || "",
      rating: r.fields["Rating"] || "N/A",
      image: r.fields["Product Image"],
      ingredients: r.fields["Ingredients"] || ""
    };

    const imgUrl = p.image?.[0]?.url;

    /* 2. LOAD INGREDIENT DB */
    const ingredientDB = await loadIngredients();

    /* 3. PARSE INGREDIENTS */
    const list = p.ingredients
      .split(",")
      .map(i => i.replace(/\(.*?\)/g, "").trim())
      .filter(Boolean);

    let totalRisk = 0;

    list.forEach(i => {
      const match = getIngredientData(i, ingredientDB);

      if (match) {
        totalRisk += match.score;
      } else {
        totalRisk += 5; // unknown ingredient
      }
    });

    const productScore = Math.max(0, Math.round(100 - totalRisk));

    /* 4. RENDER UI */
    document.getElementById("content").innerHTML = `

      <button onclick="window.location.href='index.html'"
        style="
          position: absolute;
          top: 30px;
          left: 40px;
          padding: 10px 14px;
          border: none;
          border-radius: 10px;
          background:#9fb3a0;
          color: white;
          cursor: pointer;
          font-size: 14px;
          z-index: 1000;
        ">
        ← Back to Search
      </button>

      <div class="container">

        <div class="image-box">
          ${imgUrl ? `<img src="${imgUrl}">` : ""}
        </div>

        <div class="info">
          <div class="name">${p.name}</div>
          <div class="brand">${p.brand}</div>
          <div class="type">${p.type}</div>

          <div class="rating">⭐ ${p.rating}</div>

          <div style="
            margin: 10px 0 20px;
            font-size: 16px;
            font-weight: bold;
            color:#846879;
          ">
            Safety Score: ${productScore} / 100
          </div>

          <p style="color:#666;line-height:1.5;">
            This score is calculated from ingredient-level risk data.
          </p>
        </div>

      </div>
    `;

  } catch (err) {
    console.log(err);
    document.getElementById("content").innerHTML =
      `<div class="error">Could not load product.</div>`;
  }
}

loadProduct();

</script>

</body>
</html>
