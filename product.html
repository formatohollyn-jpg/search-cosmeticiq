<div id="product">Loading product...</div>

<script>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

const id = new URLSearchParams(window.location.search).get("id");

async function loadProduct() {

  const url =
    `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`;

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${TOKEN}`
    }
  });

  const data = await res.json();

  const f = data.fields;

document.getElementById("product").innerHTML = `
  <div style="
    max-width:500px;
    margin:40px auto;
    padding:20px;
    font-family: Arial;
    background:#fff;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
  ">

    <h1 style="font-size:24px; margin-bottom:10px;">
      ${f["Product Name"]}
    </h1>

    <img src="${f["Product Image"]?.[0]?.url || ""}"
      style="
        width:100%;
        border-radius:12px;
        margin-bottom:15px;
      " />

    <p style="margin:5px 0;"><b>Brand:</b> ${f["Brand"]}</p>
    <p style="margin:5px 0;"><b>Type:</b> ${f["Product Type"]}</p>
    <p style="margin:5px 0;"><b>Rating:</b> ⭐ ${f["Rating"]}</p>

    <div style="margin-top:15px;">
      <h3>Ingredients</h3>
      <div style="
        background:#f5f5f5;
        padding:10px;
        border-radius:10px;
        font-size:13px;
        line-height:1.5;
      ">
        ${f["Ingredients"]}
      </div>
    </div>

  </div>
`;
}

loadProduct();

</script>
