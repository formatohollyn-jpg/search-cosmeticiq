<div id="product">Loading product...</div>

<script>
  <div style="padding:15px;">
  <button onclick="window.location.href='index.html'"
    style="
      padding:10px 14px;
      border:none;
      border-radius:8px;
      background:#111;
      color:white;
      cursor:pointer;
      margin-bottom:15px;
    ">
    ← Back to Search
  </button>

  <div id="product">Loading...</div>
</div>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

const id = new URLSearchParams(window.location.search).get("id");

async function loadProduct() {

  console.log("Page loaded");

  const id = new URLSearchParams(window.location.search).get("id");

  console.log("Product ID from URL:", id);

  if (!id) {
    document.getElementById("product").innerText = "No product ID in URL";
    return;
  }

  try {

    const url =
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`;

    console.log("Fetching:", url);

    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${TOKEN}`
      }
    });

    console.log("Status:", res.status);

    const text = await res.text();
    console.log("RAW RESPONSE:", text);

    const data = JSON.parse(text);

    const f = data.fields;

    document.getElementById("product").innerHTML = `
      <h1>${f["Product Name"]}</h1>
      <img src="${f["Product Image"]?.[0]?.url || ""}" />
      <p>${f["Brand"]}</p>
      <p>${f["Product Type"]}</p>
       }
  });

  const data = await res.json();

  const f = data.fields;

document.getElementById("product").innerHTML = `
  <div style="
    max-width:520px;
    margin:40px auto;
    padding:20px;
    font-family: Arial, sans-serif;
    background:#ffffff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
  ">

    <h1 style="
      font-size:24px;
      margin-bottom:10px;
      color:#111;
    ">
      ${f["Product Name"]}
    </h1>

    <img src="${f["Product Image"]?.[0]?.url || ""}" 
      style="
        width:100%;
        max-height:320px;
        object-fit:cover;
        border-radius:12px;
        margin-bottom:15px;
      " />

    <div style="font-size:14px; color:#444; line-height:1.6;">

      <p><b>Brand:</b> ${f["Brand"]}</p>
      <p><b>Type:</b> ${f["Product Type"]}</p>
      <p><b>Rating:</b> ⭐ ${f["Rating"]}</p>

      <div style="margin-top:15px;">
        <h3 style="margin-bottom:8px;">Ingredients</h3>
        <p style="
          background:#f7f7f7;
          padding:10px;
          border-radius:10px;
        ">
          ${f["Ingredients"]}
        </p>
      </div>

    </div>
  </div>
`;
}

loadProduct();

</script>
