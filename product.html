<!DOCTYPE html>
<html>
<head>
  <title>Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:linear-gradient(to bottom,#f7e8ef,#fff8f5);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .image-box {
      flex: 1;
      min-width: 280px;
    }

    .image-box img {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
      background: #eee;
    }

    .info {
      flex: 1;
      min-width: 280px;
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .brand {
      color: #666;
      margin-bottom: 10px;
    }

    .rating {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    .type {
      display: inline-block;
      padding: 6px 10px;
      background: #f0f0f0;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      margin-top: 80px;
      color: #777;
    }

    .error {
      text-align: center;
      margin-top: 80px;
      color: red;
    }
  </style>
</head>

<body>

<div id="content" class="loading">Loading product...</div>

  
<script>

const BASE_ID = "appEonAf1g5YbUi7Q";   
const TABLE_ID = "tblqIaDe6XJfHbKF5";            
const INGREDIENT_TABLE = "Ingredients";   
const TOKEN = "pat3YpZtlMB9CDiNF.e5d36fe9c1752cf6fc8bb2c924577ccbb1707a3e63d970c8c401e142e99ec782";      


/* ---------------- INGREDIENT DB ---------------- */

async function loadIngredients() {
  const res = await fetch(
    `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${id}`,
    {
      headers: {
        Authorization: `Bearer ${TOKEN}`
      }
    }
  );

  const data = await res.json();

  return data.records.map(r => ({
    name: r.fields["Ingredient"],
    score: r.fields["Risk Score"] || 5,
    level: r.fields["Risk Level"] || "Low",
    why: r.fields["Why"] || ""
  }));
}


/* ---------------- MATCH INGREDIENT ---------------- */

function getIngredientData(name, db) {
  return db.find(i =>
    (i.name || "").toLowerCase().trim() ===
    name.toLowerCase().trim()
  );
}


/* ---------------- PRODUCT ID ---------------- */

function getProductId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}


/* ---------------- LOAD PRODUCT ---------------- */

async function loadProduct() {
  const id = getProductId();

  if (!id) {
    document.getElementById("content").innerHTML =
      `<div class="error">No product selected.</div>`;
    return;
  }

  try {

    /* 1. LOAD PRODUCT */
    const res = await fetch(
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    );

    const r = await res.json();

    const p = {
      name: r.fields["Product Name"] || "Unnamed Product",
      brand: r.fields["Brand"] || "",
      type: r.fields["Product Type"] || "",
      rating: r.fields["Rating"] || "N/A",
      image: r.fields["Product Image"],
      ingredients: r.fields["Ingredients"] || ""
    };

    const imgUrl = p.image?.[0]?.url;


    /* 2. LOAD INGREDIENT DATABASE */
    const ingredientDB = await loadIngredients();


    /* 3. ANALYZE INGREDIENTS */
    let totalRisk = 0;

    const list = p.ingredients.split(",").map(i => i.trim());

    list.forEach(i => {
      const match = getIngredientData(i, ingredientDB);

      if (match) {
        totalRisk += Number(match.score);
      } else {
        totalRisk += 5; // unknown ingredient default risk
      }
    });

    let productScore = Math.max(0, 100 - totalRisk);


    /* 4. RENDER PAGE */
    document.getElementById("content").innerHTML = `

      <button onclick="window.location.href='index.html'"
        style="
          position: absolute;
          top: 30px;
          left: 40px;
          padding: 10px 14px;
          border: none;
          border-radius: 10px;
          background:#9fb3a0;
          color: white;
          cursor: pointer;
          font-size: 14px;
          z-index: 1000;
        ">
        ← Back to Search
      </button>

      <div class="container">

        <div class="image-box">
          ${imgUrl ? `<img src="${imgUrl}">` : ``}
        </div>

        <div class="info">
          <div class="name">${p.name}</div>
          <div class="brand">${p.brand}</div>
          <div class="type">${p.type}</div>

          <div class="rating">⭐ ${p.rating}</div>

          <div style="
            margin: 10px 0 20px;
            font-size: 16px;
            font-weight: bold;
            color:#846879;
          ">
            Safety Score: ${productScore} / 100
          </div>

          <p style="color:#666;line-height:1.5;">
            This score is calculated from ingredient-level risk data.
          </p>
        </div>

      </div>
    `;

  } catch (err) {
    console.log(err);
    document.getElementById("content").innerHTML =
      `<div class="error">Could not load product.</div>`;
  }
}

loadProduct();

</script>

</body>
</html>
