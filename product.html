<div id="product">Loading...</div>

<script>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

const id =
  new URLSearchParams(window.location.search).get("id");
async function loadProduct() {

  try {

    console.log("ID:", id);

    const url =
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`;

    console.log("URL:", url);

    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${TOKEN}`
      }
    });

    console.log("STATUS:", res.status);

    const text = await res.text();
    console.log("RAW RESPONSE:", text);

    const data = JSON.parse(text);

    const f = data.fields;

    document.getElementById("product").innerHTML = `
      <div style="max-width:500px;margin:auto;font-family:Arial;">

        <h1>${f["Product Name"] || ""}</h1>

        ${f["Product Image"] ? `
          <img src="${f["Product Image"][0]?.url || ""}"
          style="width:300px;border-radius:10px;" />
        ` : ""}

        <p><b>Brand:</b> ${f["Brand"] || ""}</p>
        <p><b>Type:</b> ${f["Product Type"] || ""}</p>
        <p><b>Size:</b> ${f["Size"] || ""}</p>
        <p><b>Rating:</b> ${f["Rating"] || ""}</p>

        <h3>Ingredients</h3>
        <p>${f["Ingredients"] || ""}</p>

      </div>
    `;

  } catch (err) {
    console.error("ERROR:", err);
    document.getElementById("product").innerText =
      "Error loading product (check console)";
  }

    <div style="font-size:14px; color:#444; line-height:1.6;">

      <p><b>Brand:</b> ${f["Brand"] || ""}</p>
      <p><b>Type:</b> ${f["Product Type"] || ""}</p>
      <p><b>Size:</b> ${f["Size"] || ""}</p>
      <p><b>Rating:</b> ⭐ ${f["Rating"] || ""}</p>

      <div style="margin-top:15px;">
        <h3 style="margin-bottom:8px;">Ingredients</h3>
        <div style="
          background:#f6f6f6;
          padding:12px;
          border-radius:12px;
          font-size:13px;
          white-space:pre-wrap;
        ">
          ${f["Ingredients"] || ""}
        </div>
      </div>

    </div>
  </div>
`;
}

loadProduct();

</script>
