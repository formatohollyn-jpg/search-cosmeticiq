body {
  margin: 0;

.bubbles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* ONLY vertical motion here */
.bubble-wrap {
  position: absolute;
  bottom: -120px;
  animation: floatUp 14s linear infinite;
}

/* image handles ONLY sway */
.bubble-img {
  display: block;
  animation: sway var(--sway) ease-in-out infinite;
}

/* 🌊 vertical float (no early fade) */
@keyframes floatUp {
  0% {
    transform: translateY(0px);
    opacity: 0;
  }

  5% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    transform: translateY(-120vh);
    opacity: 0;
  }
}

/* 🌬️ natural unsynced sway */
@keyframes sway {
  0%   { transform: translateX(0px); }
  25%  { transform: translateX(12px); }
  50%  { transform: translateX(-14px); }
  75%  { transform: translateX(10px); }
  100% { transform: translateX(0px); }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>

/* ---------------- AIRTABLE ---------------- */

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

/* ---------------- PRODUCTS ---------------- */

let products = [];
let visibleCount = 5;

/* ---------------- LOAD PRODUCTS ---------------- */

async function loadProducts() {

  try {

    const res = await fetch(
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    );

    const data = await res.json();

    console.log(data);

    products = data.records.map(r => ({
      id: r.id,
      name: r.fields["Product Name"] || "",
      brand: r.fields["Brand"] || "",
      type: r.fields["Product Type"] || "",
      rating: r.fields["Rating"] || "",
      image: r.fields["Product Image"],
      barcode: r.fields["Barcode"] || ""
    }));

    document.getElementById("status").innerText =
      `Loaded ${products.length} products`;

    render(products);

  } catch(err) {

    console.log(err);

    document.getElementById("status").innerText =
      "Failed to load products";

  }

}

/* ---------------- RENDER ---------------- */

function render(list) {

  const box = document.getElementById("results");

  box.innerHTML = "";

  list.slice(0, visibleCount).forEach(p => {

    const div = document.createElement("div");

    div.style.maxWidth = "420px";
    div.style.margin = "10px auto";
    div.style.padding = "14px";
    div.style.borderRadius = "14px";
    div.style.background = "#fff";
    div.style.boxShadow = "0 4px 12px rgba(0,0,0,0.05)";
    div.style.cursor = "pointer";
    div.style.transition = "0.2s";

    div.onmouseover = () => {
      div.style.transform = "translateY(-2px)";
    };

    div.onmouseout = () => {
      div.style.transform = "translateY(0px)";
    };

    div.innerHTML = `
      <div style="
        font-weight:700;
        font-size:18px;
        margin-bottom:4px;
        color:#111;
      ">
        ${p.name}
      </div>

      <div style="
        font-size:14px;
        color:#666;
        margin-bottom:6px;
      ">
        ${p.type}
      </div>

      <div style="
        font-size:13px;
        color:#999;
      ">
        ⭐ ${p.rating || ""}
      </div>
    `;

    div.onclick = () => {
      window.location.href =
        "product.html?id=" + p.id;
    };

    box.appendChild(div);

  });

}

/* ---------------- LOAD MORE ---------------- */

document.getElementById("loadMoreBtn")
.onclick = function () {

  visibleCount += 5;

  render(products);

};

/* ---------------- SEARCH ---------------- */

document.getElementById("searchInput")
.addEventListener("input", (e) => {

  const value = e.target.value.toLowerCase();

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(value)
  );

  render(filtered);

});

/* ---------------- BARCODE CLEANER ---------------- */

function cleanBarcode(value) {

  return String(value)
    .replace(/,/g, "")
    .replace(".0", "")
    .trim()
    .replace(/^0+/, "");

}

/* ---------------- FIND PRODUCT ---------------- */

function findProductByBarcode(code) {

  const cleanedCode = cleanBarcode(code);

  return products.find(p => {

    const barcodeList =
      String(p.barcode).split(",");

    return barcodeList.some(b =>
      cleanBarcode(b) === cleanedCode
    );

  });

}

/* ---------------- SCANNER ---------------- */

let scanning = false;

document.getElementById("scanBtn")
.onclick = function () {

  if (scanning) return;

  scanning = true;

  const scanner =
    document.getElementById("scanner");

  scanner.style.display = "block";

  Quagga.init({

    inputStream: {
      type: "LiveStream",
      target: scanner,
      constraints: {
        facingMode: "environment"
      }
    },

    decoder: {
      readers: [
        "ean_reader",
        "upc_reader",
        "upc_e_reader"
      ]
    }

  }, function (err) {

    if (err) {
      console.log(err);
      scanning = false;
      return;
    }

    Quagga.start();

  });

  Quagga.onDetected(function (data) {

    const code = data.codeResult.code;

    const product =
      findProductByBarcode(code);

    if (product) {

      Quagga.stop();

      scanner.style.display = "none";

      scanning = false;

      window.location.href =
        "product.html?id=" + product.id;

    }

  });

};

/* ---------------- LOAD PRODUCTS ---------------- */

loadProducts();

<!-- SUBSCRIBE SCRIPT -->

<script>

window.addEventListener("DOMContentLoaded", function () {

  const btn = document.getElementById("subscribeBtn");
  const input = document.getElementById("emailInput");

  btn.addEventListener("click", async function () {

    const email = input.value.trim();

    if (!email) {
      alert("Enter an email");
      return;
    }

    try {

      const res = await fetch(
        `https://api.airtable.com/v0/${BASE_ID}/Subscribers`,
        {
          method: "POST",
          headers: {
            Authorization: `Bearer ${TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            fields: {
              Email: email
            }
          })
        }
      );

      const data = await res.json();

      console.log(data);

      if (res.ok) {

        alert("Subscribed!");

        input.value = "";

      } else {

        alert("Error saving email");

      }

    } catch(err) {

      console.log(err);

      alert("Request failed");

    }

  });

});

</script>
