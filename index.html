<div style="
  background:#fff8f5;
  min-height:100vh;
  padding-top:60px;
  font-family:Arial,sans-serif;
">
<div style="
  position: fixed;
  top: 10px;
  left: 10px;
  font-size: 11px;
  color:#846879;
  font-family:Courier,Courier New;
">
  <img src="tiktoklogobiq.PNG" style="
  width:16px;
  height:16px;
  object-fit:contain;
  margin-top:8px;
">
  www.tiktok.com/@beauty_iq032
</div>
  
  <h1 style="
  text-align:center;
  font-size:70px;
  margin-bottom:40px;
  color:#846879;
  font-family:Courier,Courier New;
">
  BeautyIQ
</h1>
  
<div style="max-width:500px;margin:50 auto 40px;">

  <input id="searchInput"
    placeholder="Search products..."
    style="
      padding:20px;
      width:100%;
      font-size:15px;
      border:1px solid #ccc;
      border-radius:12px;
      outline:none;
      background:white;
    "
  />

</div>

<div id="status" style="
  text-align:center;
  color:#777;
  margin-bottom:15px;
  font-size:14px;
"></div>

<div id="results"></div>

<script>

const BASE_ID = "apph6wlZKiRLkKk8k";
const TABLE_NAME = "Table 1";
const TOKEN = "patLs1otKsQ0kaiOT.a2b4021760d142c883cb2ad625fc6ae8a543b44eccdb4c3fa14dd75c19d612c0";

let products = [];

async function loadProducts() {

 const res = await fetch(
  `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`,
    {
      headers: {
        Authorization: `Bearer ${TOKEN}`
      }
    }
  );

  const data = await res.json();

  products = data.records.map(r => ({
    id: r.id,
    name: r.fields["Product Name"] || "",
    brand: r.fields["Brand"] || "",
    type: r.fields["Product Type"] || "",
    rating: r.fields["Rating"] || "",
    image: r.fields["Product Image"]
  }));

  document.getElementById("status").innerText =
    `Loaded ${products.length} products`;

  render(products);
}

function render(list) {

  const box = document.getElementById("results");
  box.innerHTML = "";

  list.forEach(p => {

   const div = document.createElement("div");

    div.style.maxWidth = "420px";
    div.style.margin = "10px auto";
    div.style.padding = "14px";
    div.style.borderRadius = "14px";
    div.style.background = "#fff";
    div.style.boxShadow = "0 4px 12px rgba(0,0,0,0.05)";
    div.style.cursor = "pointer";
    div.style.transition = "0.2s";

    div.onmouseover = () => {
      div.style.transform = "translateY(-2px)";
    };

    div.onmouseout = () => {
      div.style.transform = "translateY(0px)";
    };

    div.innerHTML = `
      <div style="
        font-weight:700;
        font-size:18px;
        margin-bottom:4px;
        color:#111;
      ">
        ${p.name}
      </div>

      <div style="
        font-size:14px;
        color:#666;
        margin-bottom:6px;
      ">
        ${p.type}
      </div>

      <div style="
        font-size:13px;
        color:#999;
      ">
        ⭐ ${p.rating || ""}
      </div>
    `;

    div.onclick = () => {
      window.location.href =
        "product.html?id=" + p.id;
    };

    box.appendChild(div);
  });
}

document.getElementById("searchInput")
.addEventListener("input", (e) => {

  const value = e.target.value.toLowerCase();

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(value)
  );

  render(filtered);
});

loadProducts();

</script>

</div>
